<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGN 장비 대여</title>
<meta name="theme-color" content="#F1F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CGN 장비">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F2EF; --surface:#FFFFFF; --sunk:#E7E9E5; --ink:#1A1E23; --muted:#5D6570; --line:#D9DCD6;
  --accent:#2A4FA3; --accent-ink:#FFFFFF; --accent-soft:#E3E9F7;
  --ok:#1E7B4F; --ok-soft:#DDF0E5; --warn:#A45F00; --warn-soft:#FBEBD2;
  --bad:#BD3528; --bad-soft:#F9E0DC; --idle:#666E78; --idle-soft:#E6E7E9;
  --shadow:0 10px 30px rgba(20,24,30,.14);
  --font:"IBM Plex Sans KR","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#1A1E23; --sunk:#23282E; --ink:#E7E9EC; --muted:#9AA3AD; --line:#2E343B;
    --accent:#86A3EC; --accent-ink:#0E1420; --accent-soft:#1F2A44;
    --ok:#4FC48C; --ok-soft:#173226; --warn:#F0A63E; --warn-soft:#3A2A12;
    --bad:#F2766A; --bad-soft:#3D1D1A; --idle:#A0A7B0; --idle-soft:#2A2F35;
    --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1A1E23; --sunk:#23282E; --ink:#E7E9EC; --muted:#9AA3AD; --line:#2E343B;
  --accent:#86A3EC; --accent-ink:#0E1420; --accent-soft:#1F2A44;
  --ok:#4FC48C; --ok-soft:#173226; --warn:#F0A63E; --warn-soft:#3A2A12;
  --bad:#F2766A; --bad-soft:#3D1D1A; --idle:#A0A7B0; --idle-soft:#2A2F35;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}


.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.adm{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-right:6px}
.adm svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adm.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:6px 11px}
.adm:not(.on) span{display:none}
.xdel{border:1px solid var(--line);background:var(--surface);color:var(--bad);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;margin-left:8px;flex:none}
.xdel.arm,.btn.danger.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.admbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.admbox .flabel{display:block;margin-bottom:8px}
.warnp{font-size:12.5px;color:var(--muted);margin:8px 0 0}


.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.sum{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.sum b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sum span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sum.k-available b{color:var(--ok)} .sum.k-out b{color:var(--warn)} .sum.k-overdue b{color:var(--bad)}

.tools{display:flex;gap:8px;margin-top:12px}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.5;cursor:default}
.chipbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,58px));z-index:4;background:var(--bg);margin-inline:-16px;padding:10px 16px 8px;border-bottom:1px solid transparent}
.chipbar.stuck{border-bottom-color:var(--line)}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-padding-inline:16px}
.totop{position:fixed;right:16px;z-index:8;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.totop.lift{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
.totop svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}


.group{margin-top:18px}
.group h2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:0 0 6px;text-transform:uppercase}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:600;font-size:15px}
.sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.who{font-size:12.5px;margin-top:3px;color:var(--warn)}
.s-overdue .who{color:var(--bad);font-weight:600}
.s-retired .main{opacity:.5}
.tag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--muted);border-radius:4px;padding:0 5px;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.pick{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:7px;background:transparent;display:grid;place-items:center;padding:0}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.pick svg{width:14px;height:14px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.pick[aria-pressed="true"] svg{opacity:1}
.pick-ph{width:26px;flex:none}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none}
.p-available{background:var(--ok-soft);color:var(--ok)}
.p-out{background:var(--warn-soft);color:var(--warn)}
.p-overdue{background:var(--bad-soft);color:var(--bad)}
.p-repair,.p-retired{background:var(--idle-soft);color:var(--idle)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.banner{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px}


.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card.late{border-color:var(--bad)}
.card h3{margin:0;font-size:16px}
.meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px}
.meta .late{color:var(--bad);font-weight:600}
.items{margin:10px 0 12px;padding:0;list-style:none;border-top:1px solid var(--line)}
.items li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.items li .grow{flex:1;min-width:0}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 2px;font-size:13px}


.hrow{padding:12px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .l1{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.hrow .l1 b{font-weight:600}
.hrow .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow .l2{font-size:13px;color:var(--muted);margin-top:2px}
.hrow .l3{font-size:13px;margin-top:4px}
.issue{color:var(--bad)}
.warnc{color:var(--warn)}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.field .pitem input{width:20px;height:20px;padding:0;margin:0;border:0;background:none;flex:none;accent-color:var(--bad)}
.pitem .grow{flex:1;min-width:0}
.pitem:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.pitem .sub{margin-top:2px}
.flagline{font-size:12.5px;font-weight:600;color:var(--warn);margin-top:3px}
.range{display:flex;gap:6px;align-items:center;margin-top:10px}
.range input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 8px}
.range span{color:var(--muted)}
.rangebar{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
.rangebar .grow{flex:1}
.grp{cursor:pointer;display:flex;gap:10px;align-items:center}
.grp .gmain{flex:1;min-width:0}
.grp .chev{color:var(--muted);font-size:18px;flex:none}
.cnt{display:inline-block;background:var(--sunk);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;color:var(--ink)}
.open{color:var(--warn);font-weight:600}


.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:760px}
.nav button{background:none;border:0;padding:10px 4px 12px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 5px;min-width:17px;line-height:17px}


.selbar{position:fixed;left:0;right:0;z-index:7;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.selbar-in{pointer-events:auto;width:100%;max-width:728px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.selbar-in span{flex:1;font-weight:600}
.selbar-in .clear{background:none;border:0;color:var(--bg);opacity:.75;font-size:13px}
.selbar-in .go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:700}


.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,12,16,.45)}
.panel{position:relative;background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:18px;max-height:86%}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.panel h2{margin:0 0 4px;font-size:19px;text-wrap:balance}
.panel .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:600;cursor:pointer;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.photo-pick{display:flex;align-items:center;gap:10px}
.photo-pick img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:4px 0 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.actions-row{display:flex;gap:8px}
.actions-row .btn{flex:1}
.sec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:18px 0 6px;text-transform:uppercase}
.mini{font-size:13px;border-top:1px solid var(--line);padding:8px 0}
.viewer img{width:100%;border-radius:10px;display:block}
.chosen{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:10px}
.chosen li{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.chosen li:first-child{border-top:0}
.chosen li .grow{flex:1;min-width:0}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="appTitle">CGN 장비 대여</h1><p id="appSub"></p></div>
    <button class="adm" id="adminBtn" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span></span></button><button class="lang" id="langBtn" type="button"></button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<div class="selbar" id="selbar" hidden><div class="selbar-in"><span id="selCount"></span><button class="clear" id="selClear" type="button"></button><button class="go" id="selGo" type="button"></button></div></div>

<nav class="nav"><div class="nav-in">
  <button type="button" data-tab="equip"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="11" rx="2"/><path d="M17 10l4-2v9l-4-2"/><circle cx="10" cy="12.5" r="2.5"/></svg><span data-t="tabEquip"></span></button>
  <button type="button" data-tab="out"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M9 7V4h6v3"/><path d="M4 12h16"/></svg><span data-t="tabOut"></span><i class="badge" id="outBadge" hidden></i></button>
  <button type="button" data-tab="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-t="tabHist"></span></button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="scrim" id="scrim"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<button class="totop" id="toTop" type="button" hidden><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5.5 11.5L12 5l6.5 6.5"/></svg></button>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const T={
ko:{title:"CGN 장비 대여",sub:"태국 CGN · 카메라·렌즈·조명·마이크·배터리",switchTo:"ไทย",
 tabEquip:"장비",tabOut:"대여 중",tabHist:"이력",
 all:"전체",available:"대여 가능",out:"대여 중",overdue:"연체",repair:"수리 중",retired:"불용",
 search:"장비명, 모델, 관리번호 검색",addEq:"장비 추가",
 type_camera:"카메라",type_lens:"렌즈",type_filter:"필터",type_light:"조명",type_stand:"다리",type_mic:"마이크",type_battery:"배터리",toTop:"맨 위로",type_monitor:"모니터",type_etc:"기타",kind:"분류",
 cat_cam:"촬영장비",cat_video:"영상장비",cat_audio:"음향장비",cat_light:"조명장비",cat_live:"중계장비",
 selected:n=>`${n}개 선택됨`,clear:"선택 해제",rent:"대여하기",
 noItems:"조건에 맞는 장비가 없어요.",loading:"불러오는 중…",
 noDb:"서버에 연결할 수 없어요. 인터넷 연결을 확인하고 페이지를 새로고침해 주세요.",
 dueOn:d=>`${d} 반납`,daysLate:n=>`${n}일 연체`,
 checkoutTitle:"장비 대여",checkoutLead:"아래 장비를 대여 기록으로 남깁니다.",
 borrower:"대여자",program:"촬영 프로그램명",outDate:"대여일",dueDate:"반납 예정일",note:"메모",photo:"사진",
 addPhoto:"사진 찍기 / 선택",removePhoto:"사진 빼기",
 notePh:"구성품, 상태 등",confirmRent:"대여 기록 저장",
 needFields:"대여자, 프로그램명, 반납 예정일을 입력해 주세요.",

function normEq(r){return {...r,_id:r.id,no:Number(r.no)||0,loan:r.status==="out"&&r.loanId?{id:r.loanId,batch:r.batch,borrower:r.borrower,program:r.program,outAt:r.outAt,due:r.due}:null}}
function normLoan(r){return {...r,_id:r.id,returnedAt:r.returnedAt||null,condition:r.condition||null}}
function stamp(){const d=new Date();return ymd(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function cutoff(){const d=new Date();d.setDate(d.getDate()-HIST_DAYS);return ymd(d)}

async function boot(){
  try{
    const [appM,fsM]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)]);

    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
    fs.onSnapshot(fs.collection(db,"equipment"),snap=>{eq.clear();snap.forEach(d=>eq.set(d.id,normEq({...d.data(),id:d.id})));eqReady=true;if(loansSnap)onData()},err=>{dbFailed=true;ready=true;render()});
    fs.onSnapshot(fs.query(fs.collection(db,"loans"),fs.where("outAt",">=",cutoff()),fs.orderBy("outAt","desc")),snap=>{recentLoans=snap.docs.map(d=>normLoan({...d.data(),id:d.id}));loansSnap=true;if(!range)loans=recentLoans;if(eqReady)onData()},err=>{loansSnap=true;if(eqReady)onData()});
  }catch(e){dbFailed=true;ready=true;render()}
}
async function fbCheckout({ids,borrower,program,outDate,due,note}){
  const now=stamp(),at=(outDate||today())+" "+now.slice(11),batch="b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return fs.runTransaction(db,async tx=>{
    const refs=ids.map(id=>fs.doc(db,"equipment",id));
    const snaps=await Promise.all(refs.map(r=>tx.get(r)));
    let ok=0,skipped=0;
    snaps.forEach((sn,i)=>{const e=sn.exists()?sn.data():null;
      if(!e||(e.status||"available")!=="available"){skipped++;return}
      const lref=fs.doc(fs.collection(db,"loans"));
      tx.set(lref,{batch,eqId:sn.id,eqName:e.name||"",eqNameTh:e.nameTh||"",code:e.code||"",model:e.model||"",type:e.type||"",borrower,program,outAt:at,due,outNote:note||"",returnedAt:"",condition:"",returnNote:""});
      tx.update(refs[i],{status:"out",loanId:lref.id,batch,borrower,program,outAt:at,due,updated:now});ok++});
    return {ok,skipped}});
}
async function fbReturn({loanIds,condition,note,pickedIds}){
  const now=stamp();
  return fs.runTransaction(db,async tx=>{
    const ls=await Promise.all(loanIds.map(id=>tx.get(fs.doc(db,"loans",id))));
    const es=await Promise.all(ls.map(l=>l.exists()&&l.data().eqId?tx.get(fs.doc(db,"equipment",l.data().eqId)):null));
    let n=0;
    ls.forEach((l,i)=>{if(!l.exists()||l.data().returnedAt)return;
      const cd=pickedIds&&!pickedIds.includes(l.id)?"ok":condition;
      const nt=pickedIds&&cd==="ok"?"":(note||"");
      tx.update(l.ref,{returnedAt:now,condition:cd,returnNote:nt});
      const e=es[i];
      if(e&&e.exists()&&e.data().loanId===l.id)tx.update(e.ref,{status:cd==="issue"?"repair":"available",issue:cd==="issue"?nt:"",flag:cd==="minor"?nt:"",loanId:"",batch:"",borrower:"",program:"",outAt:"",due:"",updated:now});
      n++});
    return n});
}
async function fbDeleteLoans(ids){
  const now=stamp();
  return fs.runTransaction(db,async tx=>{
    const ls=await Promise.all(ids.map(id=>tx.get(fs.doc(db,"loans",id))));
    const es=await Promise.all(ls.map(l=>l.exists()&&l.data().eqId&&!l.data().returnedAt?tx.get(fs.doc(db,"equipment",l.data().eqId)):null));
    let n=0;
    ls.forEach((l,i)=>{if(!l.exists())return;const e=es[i];
      if(e&&e.exists()&&e.data().loanId===l.id)tx.update(e.ref,{status:"available",loanId:"",batch:"",borrower:"",program:"",outAt:"",due:"",updated:now});
      tx.delete(l.ref);n++});
    return n});
}
async function fbEditLoans(ids,{borrower,program,outDate,due}){
  const now=stamp();
  return fs.runTransaction(db,async tx=>{
    const ls=await Promise.all(ids.map(id=>tx.get(fs.doc(db,"loans",id))));
    const es=await Promise.all(ls.map(l=>l.exists()&&l.data().eqId&&!l.data().returnedAt?tx.get(fs.doc(db,"equipment",l.data().eqId)):null));
    ls.forEach((l,i)=>{if(!l.exists())return;const d=l.data();const outAt=outDate+" "+String(d.outAt||"").slice(11,16);
      tx.update(l.ref,{borrower,program,due,outAt});
      const e=es[i];if(e&&e.exists()&&e.data().loanId===l.id)tx.update(e.ref,{borrower,program,due,outAt,updated:now})});
  });
}
function afterLoanChange(ids,patch){

}

function lightRank(e){const n=(e.name||"")+" "+(e.model||"")+" "+(e.code||"");
  if(/Softbox|Projection|PJ-|Fresnel|Scrim/i.test(n))return 3;
  if(/BULB|전구/i.test(n))return 2;
  if(/Pavo\s*Tube|TUBE/i.test(n))return 1;
  return 0}
const natural=(a,b)=>String(a||"").localeCompare(String(b||""),undefined,{numeric:true});
function lightSort(a,b){const r=lightRank(a)-lightRank(b);if(r)return r;
  if(lightRank(a)>=1&&lightRank(a)<=2)return natural(a.code,b.code)||((a.no||0)-(b.no||0));
  return String(a.name).localeCompare(String(b.name))||String(a.model).localeCompare(String(b.model))||natural(a.code,b.code)}

function tags(code){return String(code||"").split(",").map(x=>x.trim()).filter(Boolean).map(c=>`<span class="tag">${esc(c)}</span>`).join(" ")}

const standRank=e=>/조명|Lighting|C-Stand|RA-C/i.test((e.name||"")+" "+(e.model||""))?1:0;
function standSort(a,b){return (standRank(a)-standRank(b))||((a.no||0)-(b.no||0))}

  const h=`<h2>${esc(t("flagTitle"))}</h2><p class="lead">${esc(nm(e))}</p>
  <div class="field"><label for="fgN">${esc(t("flag"))}</label><textarea id="fgN" placeholder="${esc(t("flagPh"))}">${esc(e.flag||"")}</textarea></div>
  <div class="actions-row">${e.flag?`<button class="btn danger" id="fgClear" type="button">${esc(t("clearFlag"))}</button>`:""}<button class="btn" id="fgCancel" type="button">${esc(t("cancel"))}</button><button class="btn primary" id="fgSave" type="button">${esc(t("save"))}</button></div>`;
  openSheet(h,root=>{
    root.querySelector("#fgCancel").addEventListener("click",()=>openDetail(id));
    const cl=root.querySelector("#fgClear");cl&&cl.addEventListener("click",()=>setFlag(id,""));
    root.querySelector("#fgSave").addEventListener("click",()=>setFlag(id,root.querySelector("#fgN").value.trim()));
  });
}
async function setFlag(id,flag){try{await fs.updateDoc(fs.doc(db,"equipment",id),{flag,updated:stamp()});closeSheet();render();toast(t(flag?"flagSaved":"flagCleared"))}catch(err){toast(t("failed"))}}
function openReturn(loanIds){
  const act=[...eq.values()].filter(e=>e.status==="out"&&e.loan&&loanIds.includes(e.loan.id));if(!act.length)return;const multi=act.length>1;
  const h=`<h2>${esc(t("returnTitle"))}</h2><p class="lead">${esc(t("returnLead",act.length))}</p>
  <ul class="chosen">${act.map(e=>`<li><div class="grow"><b>${esc(nm(e))}</b><div class="sub">${e.code?tags(e.code):""}<span>${esc(e.loan.borrower)} · ${esc(e.loan.program)}</span></div></div></li>`).join("")}</ul>
  <div class="field"><span class="flabel">${esc(t("condition"))}</span><div class="seg"><label><input type="radio" name="cond" id="rOk" value="ok" checked><span>${esc(t("condOk"))}</span></label><label><input type="radio" name="cond" id="rMinor" value="minor"><span>${esc(t("condMinor"))}</span></label><label><input type="radio" name="cond" id="rIssue" value="issue"><span>${esc(t("condIssue"))}</span></label></div></div>
  ${multi?`<div class="field" id="rPickBox" hidden><span class="flabel">${esc(t("pickIssue"))}</span><div class="plist">${act.map(e=>`<label class="pitem"><input type="checkbox" value="${esc(e.loan.id)}"><div class="grow"><b>${esc(nm(e))}</b><div class="sub">${e.code?tags(e.code):""}<span>${esc(e.model||"")}</span></div></div></label>`).join("")}</div></div>`:""}
  <div class="field"><label for="rNote">${esc(t("note"))}</label><textarea id="rNote" placeholder="${esc(t("issueNote"))}"></textarea></div>
  <div class="actions-row"><button class="btn" id="rCancel" type="button">${esc(t("cancel"))}</button><button class="btn primary" id="rSave" type="button">${esc(t("confirmReturn"))}</button></div>`;
  openSheet(h,root=>{
    root.querySelector("#rCancel").addEventListener("click",closeSheet);
    const box=root.querySelector("#rPickBox"),save=root.querySelector("#rSave");
    const curCond=()=>root.querySelector('input[name="cond"]:checked').value;
    const picked=()=>box?[...box.querySelectorAll("input:checked")].map(i=>i.value):null;
    const sync=()=>{const c=curCond();if(box)box.hidden=c==="ok";
      if(multi&&c!=="ok"){const p=picked().length;save.textContent=p?t("retSum",act.length-p,p,t(c==="issue"?"condIssue":"condMinor")):t("confirmReturn")}else save.textContent=t("confirmReturn")};
    root.querySelectorAll('input[name="cond"]').forEach(r=>r.addEventListener("change",sync));
    box&&box.addEventListener("change",sync);
    save.addEventListener("click",async ev=>{
      const cond=curCond(),note=root.querySelector("#rNote").value.trim();
      const pk=multi&&cond!=="ok"?picked():null;
      if(pk&&!pk.length){toast(t("needPick"));box.scrollIntoView({block:"center",behavior:"smooth"});return}
      const btn=ev.target;btn.disabled=true;btn.textContent=t("saving");
      try{const n=await fbReturn({loanIds:act.map(e=>e.loan.id),condition:cond,note,pickedIds:pk});
        closeSheet();render();toast(t("returned",n));
      }catch(err){toast(t("failed"));btn.disabled=false;btn.textContent=t("confirmReturn")}
    });
  });
}


function renderOut(v){
  const act=[...eq.values()].filter(e=>e.status==="out"&&e.loan);
  const groups=new Map();act.forEach(e=>{const k=e.loan.batch||e.loan.id;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});
  const arr=[...groups.values()].map(items=>({items,L:items[0].loan,late:items.some(e=>stOf(e)==="overdue")})).sort((a,b)=>(b.late-a.late)||String(a.L.due).localeCompare(String(b.L.due)));
  if(!arr.length){v.innerHTML=`<div class="card"><div class="empty">${esc(t("noOut"))}</div></div>`;return}
  v.innerHTML=arr.map((g,i)=>`<article class="card${g.late?" late":""}"><h3>${esc(g.L.program)}</h3>
    <div class="meta"><span>${esc(g.L.borrower)}</span><span>${esc(t("outSince",fD(g.L.outAt)))}</span>${g.late?`<span class="late">${esc(t("daysLate",lateDays(g.L.due)))}</span>`:`<span>${esc(t("dueOn",fD(g.L.due)))}</span>`}</div>
    <ul class="items">${g.items.map(e=>`<li><div class="grow">${esc(nm(e))} ${e.code?tags(e.code):""}</div><button class="linkbtn" type="button" data-ret="${e.loan.id}">${esc(t("returnOne"))}</button></li>`).join("")}</ul>
    <button class="btn primary block" type="button" data-retall="${i}">${esc(g.items.length>1?t("returnAll"):t("returnOne"))}</button></article>`).join("");
  v.querySelectorAll("[data-ret]").forEach(b=>b.addEventListener("click",()=>openReturn([b.dataset.ret])));
  v.querySelectorAll("[data-retall]").forEach(b=>b.addEventListener("click",()=>openReturn(arr[+b.dataset.retall].items.map(e=>e.loan.id))));
}


function renderHist(v){
  const key="hist-"+lang;
  if(v.dataset.hshell!==key||!$("#hq")){
    v.dataset.hshell=key;
    v.innerHTML=`<div class="tools" style="margin-top:14px"><input class="search" id="hq" type="search" placeholder="${esc(t("histSearch"))}"></div>
    <div class="range"><input type="date" id="rFrom" aria-label="${esc(t("from"))}"><span>~</span><input type="date" id="rTo" aria-label="${esc(t("to"))}"><button class="btn" id="rGo" type="button">${esc(t("periodSearch"))}</button></div>
    <div class="rangebar"><span id="rLabel"></span><span class="grow"></span><button class="linkbtn" id="rReset" type="button">${esc(t("backRecent"))}</button><button class="linkbtn" id="rExport" type="button">${esc(t("exportCsv"))}</button></div>
    <div class="list" style="margin-top:8px" id="hList"></div>`;
    const f=$("#rFrom"),to=$("#rTo");f.value=range?range.from:cutoff();to.value=range?range.to:today();
    $("#rGo").addEventListener("click",async ev=>{if(!f.value||!to.value||f.value>to.value){toast(t("badRange"));return}
      const b=ev.target;b.disabled=true;b.textContent=t("loading");
      try{await searchRange(f.value,to.value);paintHist()}catch(e){toast(t("failed"))}b.disabled=false;b.textContent=t("periodSearch")});
    $("#rReset").addEventListener("click",()=>{range=null;loans=recentLoans;f.value=cutoff();to.value=today();paintHist()});
    $("#rExport").addEventListener("click",()=>exportCsv(histVisible));
    const qi=$("#hq");qi.value=ui.hq;qi.addEventListener("input",()=>{ui.hq=qi.value;paintHist()});
    $("#hList").addEventListener("click",ev=>{const g=ev.target.closest("[data-g]");if(g)openBatch(g.dataset.g)});
    $("#hList").addEventListener("keydown",ev=>{const g=ev.target.closest&&ev.target.closest("[data-g]");if(g&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();openBatch(g.dataset.g)}});
  }
  paintHist();
}
let histGroups=new Map(), histVisible=[];
function groupLoans(list){const m=new Map();list.forEach(l=>{const k=l.batch||l.id;if(!m.has(k))m.set(k,[]);m.get(k).push(l)});return m}
function paintHist(){
  const q=ui.hq.trim().toLowerCase();
  histGroups=groupLoans(loans);
  const lbl=$("#rLabel");if(lbl)lbl.textContent=range?t("rangeLbl",range.from,range.to):t("recentLbl");
  const rr=$("#rReset");if(rr)rr.hidden=!range;
  const groups=[...histGroups.entries()].filter(([k,items])=>!q||items.some(l=>[l.borrower,l.program,l.eqName,l.eqNameTh,l.code,l.model].join(" ").toLowerCase().includes(q)));
  let h="";
  if(!groups.length)h=`<div class="empty">${esc(loansReady?t("noHist"):t("loading"))}</div>`;
  h+=groups.slice(0,300).map(([k,items])=>{const L=items[0];const back=items.filter(l=>l.returnedAt);const open=back.length<items.length;
    const last=back.map(l=>l.returnedAt).sort().pop();const issue=items.some(l=>l.condition==="issue");const minor=!issue&&items.some(l=>l.condition==="minor");
    const end=open?(back.length?`<span class="open">${esc(t("partBack",back.length,items.length))}</span>`:`<span class="open">${esc(t("inUse"))}</span>`):esc(fD(last));
    return `<div class="hrow grp" data-g="${esc(k)}" role="button" tabindex="0"><div class="gmain"><div class="l1"><b>${esc(L.program)}</b><span class="d">${esc(fD(L.outAt))} → ${end}</span></div>
   <div class="l2">${esc(L.borrower)} · <span class="cnt">${esc(t("itemsN",items.length))}</span>${issue?` · <span class="issue">${esc(t("condIssue"))}</span>`:minor?` · <span class="warnc">${esc(t("flag"))}</span>`:""}</div></div><span class="chev" aria-hidden="true">›</span></div>`}).join("");
  histVisible=groups.flatMap(([k,items])=>items);
  $("#hList").innerHTML=h;
}
function openBatch(k){const items=histGroups.get(k);if(!items||!items.length)return;const L=items[0];const adm=isAdmin();
  const notes=[...new Set(items.map(l=>l.outNote).filter(Boolean))];
  const h=`<h2>${esc(L.program)}</h2><p class="lead">${esc(L.borrower)} · ${esc(t("outSince",fD(L.outAt)))} · ${esc(t("dueDate"))} ${esc(fD(L.due))}</p>
  ${notes.length?`<p class="lead">${notes.map(esc).join("<br>")}</p>`:""}
  <div class="sec">${esc(t("rentedItems"))} · ${items.length}</div>
  <ul class="chosen">${items.map(l=>`<li><div class="grow"><b>${esc(lnm(l))}</b><div class="sub">${l.code?tags(l.code):""}<span>${esc(l.model||"")}</span></div>
    ${l.condition==="issue"?`<div class="sub issue">${esc(t("condIssue"))}${l.returnNote?": "+esc(l.returnNote):""}</div>`:l.condition==="minor"?`<div class="sub warnc">${esc(t("flag"))}${l.returnNote?": "+esc(l.returnNote):""}</div>`:(l.returnNote?`<div class="sub">${esc(l.returnNote)}</div>`:"")}</div>
    <span class="d" style="font-size:12.5px;white-space:nowrap">${l.returnedAt?esc(t("allBack",fD(l.returnedAt))):`<span class="open">${esc(t("inUse"))}</span>`}</span>${adm?`<button class="xdel" type="button" data-del="${esc(l.id)}">${esc(tk("delOne"))}</button>`:""}</li>`).join("")}</ul>
  ${adm?`<div class="admbox"><span class="flabel">${esc(tk("admin"))}</span><div class="actions-row"><button class="btn" id="bEdit" type="button">${esc(tk("editLoan"))}</button><button class="btn danger" id="bDel" type="button">${esc(tk("delBatch"))}</button></div><p class="warnp">${esc(tk("delWarn"))}</p></div>`:""}
  <div class="actions"><button class="btn block" id="bClose" type="button">${esc(t("close"))}</button></div>`;
  openSheet(h,root=>{root.querySelector("#bClose").addEventListener("click",closeSheet);
    if(adm){root.querySelector("#bEdit").addEventListener("click",()=>openEditBatch(k));armBtn(root.querySelector("#bDel"),()=>doDelete(items.map(l=>l.id)));
      root.querySelectorAll("[data-del]").forEach(b=>armBtn(b,()=>doDelete([b.dataset.del])))}});
}


const viewEl=$("#view");
viewEl.addEventListener("click",ev=>{
  if(ui.tab!=="equip"||!viewEl.dataset.shell)return;
  const f=ev.target.closest("[data-filter]");if(f){ui.filter=f.dataset.filter;paintEquip();return}
  const c=ev.target.closest("[data-cat]");if(c){ui.cat=c.dataset.cat;paintEquip();jumpToList();const on=$("#chipBox [aria-pressed=\"true\"]");try{on&&on.scrollIntoView({inline:"center",block:"nearest"})}catch(e){}return}
  const p=ev.target.closest(".pick");if(p){const id=p.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);p.setAttribute("aria-pressed",selected.has(id));paintSel();return}
  const m=ev.target.closest(".row .main");if(m)openDetail(m.dataset.id);
});
viewEl.addEventListener("keydown",ev=>{if(ui.tab!=="equip")return;const m=ev.target.closest&&ev.target.closest(".row .main");if(m&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();openDetail(m.dataset.id)}});

function setHdr(){const h=document.querySelector(".top");if(h)document.documentElement.style.setProperty("--hdr",h.offsetHeight+"px")}
setHdr();window.addEventListener("resize",setHdr);
const smooth=()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth";
function jumpToList(){const a=$("#chipAnchor");if(!a)return;const y=a.getBoundingClientRect().top+window.scrollY-document.querySelector(".top").offsetHeight;if(window.scrollY>y)window.scrollTo({top:y,behavior:smooth()})}
function onScroll(){const b=$("#toTop");b.hidden=window.scrollY<500||!$("#sheet").hidden;b.classList.toggle("lift",!$("#selbar").hidden);b.setAttribute("aria-label",t("toTop"));
  const bar=$("#chipBar"),a=$("#chipAnchor");if(bar&&a)bar.classList.toggle("stuck",a.getBoundingClientRect().top<document.querySelector(".top").offsetHeight)}
window.addEventListener("scroll",onScroll,{passive:true});
$("#toTop").addEventListener("click",()=>window.scrollTo({top:0,behavior:smooth()}));
render();
boot();
})();
</script>
